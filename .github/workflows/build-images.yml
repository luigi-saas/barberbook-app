# ============================================================================
# Build the three service images on GitHub runners (7 GB — no OOM) and push
# them to GHCR, so Render free instances only RUN prebuilt images.
#
#   Actions → "Build images (GHCR)" → Run workflow
#
# After the first green run: GitHub → Your profile → Packages → make each
# barberbook-* package PUBLIC (free, no Render registry credentials needed),
# then point Render at the images (see render.image.yaml / docs/Render.md).
# ============================================================================
name: Build images (GHCR)

on:
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, app, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/barberbook-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/barberbook-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
