# ============================================================================
# Render Blueprint — BarberBook.ma (FREE TIER)
#
# Provisions the three Next.js services that used to live on Vercel:
#   barberbook-web  ← apps/web  (marketing + guest booking flow)
#   barberbook-app  ← apps/app  (merchant dashboard)
#   barberbook-api  ← apps/api  (webhooks + cron endpoints; its build applies
#                     the Prisma schema to the database)
#
# DATABASE: create manually (Blueprints cannot provision free Postgres):
#   Render Dashboard → New + → Postgres → Free, region Frankfurt
#   → copy "Internal Database URL" → paste as DATABASE_URL when prompted.
#
# FREE TIER REALITIES (docs/Render.md has details and the escalation path):
#   - services sleep after ~15 min idle (cold start 30-60s on next visit)
#   - 512 MB RAM: `next build` MAY OOM on free instances. If a build dies
#     with "Killed"/OOM, ask for the GitHub Actions image-build pipeline —
#     it builds on GH's 7 GB runners and Render only runs the prebuilt image.
#   - free Postgres expires after 30 days (upgrade to keep data)
# ============================================================================
services:
  # ---------------------------------------------------------------------------
  # Web — public marketing site + guest booking flow (what customers see)
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-web
    runtime: node
    region: frankfurt # closest Render region to Morocco (Casablanca)
    plan: free # 512MB RAM: see docs/Render.md "Free tier realities";
    #   see docs/Render.md "Build memory" for options.
    buildCommand: |
      npm install -g bun@1
      bun install
      bun run build --filter web
    startCommand: cd apps/web && bun run start # package.json start runs scripts/db-setup.mjs first (schema + seed, idempotent)
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Canonical host for robots/sitemap/metadata (legacy next-forge var).
      - key: VERCEL_PROJECT_PRODUCTION_URL
        value: barberbook-web.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com
      # The guest booking flow writes bookings straight to Postgres.
      # Paste the same "Internal Database URL" as the app/api services.
      - key: DATABASE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Dashboard — merchant operating system (the SaaS wedge, Phase 2 rebuild)
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-app
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: |
      npm install -g bun@1
      bun install
      bun run build --filter app
    startCommand: cd apps/app && bun run start # package.json start runs scripts/db-setup.mjs first (schema + seed, idempotent)
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: VERCEL_PROJECT_PRODUCTION_URL
        value: barberbook-app.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com
      # Paste the Postgres "Internal Database URL" (Render DB, or your Neon
      # URL to keep it for now). See header comment, option A.
      - key: DATABASE_URL
        sync: false
      # Dashboard auth (Clerk). Copy from the Vercel project before deleting
      # it, and add barberbook-app.onrender.com to Clerk's allowed origins.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # API — webhook + cron endpoints. Its build also applies the Prisma schema
  # to the database (prisma db push), so deploys keep the DB in sync.
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: |
      npm install -g bun@1
      bun install
      bunx prisma generate --schema=packages/database/prisma/schema.prisma
      # Apply schema + demo content. Both no-op safely when DATABASE_URL is
      # not set yet (first deploy before the DB is pasted in).
      node scripts/db-setup.mjs
      bun run build --filter api
    # db-setup ALSO runs at start (idempotent, never blocks boot): even if the
    # build ran before DATABASE_URL existed, the first boot after it is set
    # applies the schema and seeds demo content. Same for web + app below —
    # whichever service boots first brings the database up.
    startCommand: cd apps/api && bun run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com
      - key: DATABASE_URL
        sync: false # same Internal Database URL as barberbook-app
      # Integrations are optional (graceful degradation) — add when needed:
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: RESEND_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
