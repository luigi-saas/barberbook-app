# ============================================================================
# Render Blueprint — BarberBook.ma
#
# Provisions the full platform that used to live on Vercel:
#   barberbook-web  ← apps/web  (marketing + guest booking flow)
#   barberbook-app  ← apps/app  (merchant dashboard, port 3000 on Vercel)
#   barberbook-api  ← apps/api  (webhooks + cron endpoints)
#   barberbook-db   ← managed PostgreSQL (replaces Neon)
#   barberbook-cron ← keep-alive cron (replaces apps/api/vercel.json crons)
#
# Create it: Render Dashboard → "New +" → "Blueprint" → select this repo and
# the branch with render.yaml. Render reads this file and asks you to confirm.
# Full step-by-step guide + cost notes: docs/Render.md
#
# NOTE: onrender.com subdomains below assume the service names are free.
#       If Render assigns different URLs, update every NEXT_PUBLIC_* var.
# ============================================================================

databases:
  - name: barberbook-db
    databaseName: barberbook
    user: barberbook
    region: frankfurt # closest Render region to Morocco (Casablanca)
    plan: free # ⚠️ Render free Postgres EXPIRES AFTER 30 DAYS — upgrade to
    #    starter (~$6/mo) before real data goes in.

services:
  # ---------------------------------------------------------------------------
  # Web — public marketing site + guest booking flow (this is what customers see)
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-web
    runtime: node
    region: frankfurt
    plan: starter # ⚠️ free tier (512MB) will likely OOM during `next build`;
    #   see docs/Render.md "Build memory" for options.
    buildCommand: |
      npm install -g bun@1
      bun install
      bun run build --filter web
    startCommand: cd apps/web && bun run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Legacy next-forge var: canonical host for robots/sitemap/metadata.
      - key: VERCEL_PROJECT_PRODUCTION_URL
        value: barberbook-web.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com

  # ---------------------------------------------------------------------------
  # Dashboard — merchant operating system (the SaaS wedge, Phase 2 rebuild)
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-app
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: |
      npm install -g bun@1
      bun install
      bun run build --filter app
    startCommand: cd apps/app && bun run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: VERCEL_PROJECT_PRODUCTION_URL
        value: barberbook-app.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: barberbook-db
          property: connectionString
      # Dashboard auth (Clerk). Fill real values in the Render dashboard,
      # or copy them from the Vercel project before decommissioning it.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # API — webhook + cron endpoints. Its build also applies the Prisma schema
  # to the database (prisma db push), so deploys keep the DB in sync.
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: |
      npm install -g bun@1
      bun install
      bunx prisma generate --schema=packages/database/prisma/schema.prisma
      bunx prisma db push --schema=packages/database/prisma/schema.prisma --skip-generate
      bun run build --filter api
    startCommand: cd apps/api && bun run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: barberbook-db
          property: connectionString
      # Integrations are optional (graceful degradation) — add when needed:
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: RESEND_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Cron — replaces Vercel cron jobs (apps/api/vercel.json). Pings the API so
  # free Postgres/Neon-style idle limits don't kill the DB and services stay
  # warm. Delete this service if you don't want it (cron jobs are paid).
  # ---------------------------------------------------------------------------
  - type: cron
    name: barberbook-cron
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 1 * * *" # daily 01:00 UTC (same as the Vercel cron)
    buildCommand: echo "cron runner — no build required"
    command: curl -fsS https://barberbook-api.onrender.com/cron/keep-alive
