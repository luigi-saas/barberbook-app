# ============================================================================
# Render Blueprint — BarberBook.ma
#
# Provisions the three Next.js services that used to live on Vercel:
#   barberbook-web  ← apps/web  (marketing + guest booking flow)
#   barberbook-app  ← apps/app  (merchant dashboard)
#   barberbook-api  ← apps/api  (webhooks + cron endpoints)
#   barberbook-cron ← keep-alive cron (replaces apps/api/vercel.json crons)
#
# DATABASE: Render Blueprints cannot provision FREE Postgres (paid `basic`
# can). Two options:
#   A) Free: Render Dashboard → New + → PostgreSQL → Free → create
#      `barberbook-db`, copy the "Internal Database URL", paste it into the
#      DATABASE_URL env var of barberbook-app and barberbook-api when Render
#      prompts for sync:false values.
#   B) Paid in-file: add this block back and reference it from DATABASE_URL
#      (see docs/Render.md for the snippet).
# Full guide: docs/Render.md
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Web — public marketing site + guest booking flow (what customers see)
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-web
    runtime: node
    region: frankfurt # closest Render region to Morocco (Casablanca)
    plan: starter # ⚠️ free tier (512MB) may OOM during `next build`;
    #   see docs/Render.md "Build memory" for options.
    buildCommand: |
      npm install -g bun@1
      bun install
      bun run build --filter web
    startCommand: cd apps/web && bun run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Canonical host for robots/sitemap/metadata (legacy next-forge var).
      - key: VERCEL_PROJECT_PRODUCTION_URL
        value: barberbook-web.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com

  # ---------------------------------------------------------------------------
  # Dashboard — merchant operating system (the SaaS wedge, Phase 2 rebuild)
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-app
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: |
      npm install -g bun@1
      bun install
      bun run build --filter app
    startCommand: cd apps/app && bun run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: VERCEL_PROJECT_PRODUCTION_URL
        value: barberbook-app.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com
      # Paste the Postgres "Internal Database URL" (Render DB, or your Neon
      # URL to keep it for now). See header comment, option A.
      - key: DATABASE_URL
        sync: false
      # Dashboard auth (Clerk). Copy from the Vercel project before deleting
      # it, and add barberbook-app.onrender.com to Clerk's allowed origins.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # API — webhook + cron endpoints. Its build also applies the Prisma schema
  # to the database (prisma db push), so deploys keep the DB in sync.
  # ---------------------------------------------------------------------------
  - type: web
    name: barberbook-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: |
      npm install -g bun@1
      bun install
      bunx prisma generate --schema=packages/database/prisma/schema.prisma
      bunx prisma db push --schema=packages/database/prisma/schema.prisma --skip-generate
      bun run build --filter api
    startCommand: cd apps/api && bun run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_WEB_URL
        value: https://barberbook-web.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://barberbook-app.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://barberbook-api.onrender.com
      - key: DATABASE_URL
        sync: false # same Internal Database URL as barberbook-app
      # Integrations are optional (graceful degradation) — add when needed:
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: RESEND_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Cron — replaces Vercel cron jobs (apps/api/vercel.json). Pings the API
  # daily so the DB stays active and services stay warm. Delete this service
  # if you don't want it.
  # ---------------------------------------------------------------------------
  - type: cron
    name: barberbook-cron
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 1 * * *" # daily 01:00 UTC (same as the Vercel cron)
    buildCommand: echo "cron runner — no build required"
    startCommand: curl -fsS https://barberbook-api.onrender.com/cron/keep-alive
